map $uri $cache_control {
    ~^/assets/fonts/   "public, max-age=31536000, immutable";
    ~^/assets/         "public, max-age=604800";
    ~^/(og\.png|report\.pdf|pitch/og\.png|pitch/pitch\.pdf)$  "public, max-age=86400";
    default            "no-cache";
}

# CSP only for HTML: the logo SVGs carry their own <style> for the animation.
map $sent_http_content_type $csp {
    ~^text/html  "default-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; media-src 'self'; frame-src https://www.youtube-nocookie.com; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; object-src 'none'";
    default      "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/auth.conf;

    server_tokens off;
    absolute_redirect off;
    access_log off;
    log_not_found off;

    charset utf-8;
    charset_types text/css application/javascript image/svg+xml text/plain;

    add_header Cache-Control $cache_control always;
    add_header Content-Security-Policy $csp always;
    add_header X-Robots-Tag "noindex" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/css application/javascript image/svg+xml text/plain application/json;

    if ($request_uri ~ "^(?<dir>[^?]*/)index\.html(?<qs>\?.*)?$") {
        return 301 $dir$qs;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        return 404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
