services:
  booklint:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      - LLM_NAME
      - LLM_BASE_URL
      - LLM_API_KEY
      - BASE_URL
      - API_KEY
      - BOOKLET_ROOT
      - CACHE_DIR=/work/.cache
    volumes:
      - ./data:/work/data:ro
      - ./runs:/work/runs
      - ./.cache:/work/.cache
